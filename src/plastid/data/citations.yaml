# Citation registry — reports pull from here; nobody types a reference by hand.
# Keys are used in Result.citations.

misa:
  text: "Beier S, Thiel T, Münch T, Scholz U, Mascher M. MISA-web: a web server for microsatellite prediction. Bioinformatics 33:2583–2585 (2017)."
  doi: "10.1093/bioinformatics/btx198"
biopython:
  text: "Cock PJA et al. Biopython: freely available Python tools for computational molecular biology and bioinformatics. Bioinformatics 25:1422–1423 (2009)."
  doi: "10.1093/bioinformatics/btp163"
mafft:
  text: "Katoh K, Standley DM. MAFFT multiple sequence alignment software version 7: improvements in performance and usability. Molecular Biology and Evolution 30:772–780 (2013)."
  doi: "10.1093/molbev/mst010"
# BLAST+ and ARAGORN are the two tools the self-built annotator runs itself (P3B-07/P3B-08), so a
# report of its results has to cite them — measured 09/10/2026 (P3B-09): the module declared both
# keys and neither was in this registry, so `plastid annotate --docx` stopped with a CitationError
# instead of writing the report. A citation is not decoration here: the report is the artifact that
# says which programs produced an annotation.
blast:
  text: "Camacho C, Coulouris G, Avagyan V, Ma N, Papadopoulos J, Bealer K, Madden TL. BLAST+: architecture and applications. BMC Bioinformatics 10:421 (2009)."
  doi: "10.1186/1471-2105-10-421"
aragorn:
  text: "Laslett D, Canback B. ARAGORN, a program to detect tRNA genes and tmRNA genes in nucleotide sequences. Nucleic Acids Research 32:11–16 (2004)."
  doi: "10.1093/nar/gkh152"
mummer:
  text: "Marçais G, Delcher AL, Phillippy AM, Coston R, Salzberg SL, Zimin A. MUMmer4: a fast and versatile genome alignment system. PLOS Computational Biology 14:e1005944 (2018)."
  doi: "10.1371/journal.pcbi.1005944"
paml:
  text: "Yang Z. PAML 4: phylogenetic analysis by maximum likelihood. Molecular Biology and Evolution 24:1586–1591 (2007)."
  doi: "10.1093/molbev/msm088"
cbol:
  text: "CBOL Plant Working Group. A DNA barcode for land plants. Proceedings of the National Academy of Sciences 106:12794–12797 (2009)."
  doi: "10.1073/pnas.0905845106"
yang_nielsen:
  text: "Yang Z, Nielsen R. Estimating synonymous and nonsynonymous substitution rates under realistic evolutionary models. Molecular Biology and Evolution 17:32–43 (2000)."
  doi: "10.1093/oxfordjournals.molbev.a026236"
