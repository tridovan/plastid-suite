# Citation registry — reports pull from here; nobody types a reference by hand.
# Keys are used in Result.citations.

misa:
  text: "Beier S, Thiel T, Münch T, Scholz U, Mascher M. MISA-web: a web server for microsatellite prediction. Bioinformatics 33:2583–2585 (2017)."
  doi: "10.1093/bioinformatics/btx198"
biopython:
  text: "Cock PJA et al. Biopython: freely available Python tools for computational molecular biology and bioinformatics. Bioinformatics 25:1422–1423 (2009)."
  doi: "10.1093/bioinformatics/btp163"
mafft:
  text: "Katoh K, Standley DM. MAFFT multiple sequence alignment software version 7: improvements in performance and usability. Molecular Biology and Evolution 30:772–780 (2013)."
  doi: "10.1093/molbev/mst010"
pga:
  text: "Qu X-J, Moore MJ, Li D-Z, Yi T-S. PGA: a software package for rapid, accurate, and flexible batch annotation of plastomes. Plant Methods 15:50 (2019)."
  doi: "10.1186/s13007-019-0435-7"
