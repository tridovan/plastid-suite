# Central defaults — thresholds in one place, not scattered through modules.

ir:
  min_identity: 0.999 # the mandatory gate (PROJECT.md §9A)
  min_length: 5000
  copy_length_tolerance: 5

ssr:
  misa:
    # MISA defaults as shipped in the IPK zip (PROJECT.md §10.2) — do not "tune" them.
    unit_repeats: { 1: 10, 2: 6, 3: 5, 4: 5, 5: 5, 6: 5 }
    interruptions: 100

codon:
  # D2-03 (03/10/2026): plastids use NCBI table 1 (standard). The table itself is compiled into
  # core/codon.py; a test keeps this record and that constant in step, so they cannot drift.
  translation_table: 1
  # CAI · CBI · Fop are only meaningful against a declared reference. Until a highly-expressed
  # set is defined, the reference is the analysed CDS set itself — named in every output.
  reference: self

orf:
  # D3-03 (03/10/2026): the check reads the record's own /transl_table. This value is the
  # fallback for a record that declares none. It is the same number as codon.translation_table
  # on purpose — but it is a different decision (what to do when the record is silent), so it
  # is recorded separately. Measured: all 1,099 CDS in the project's dataset declare 11.
  default_translation_table: 1

diversity:
  # D2-02 (03/10/2026): the mVISTA-style convention. A π curve means nothing without its window,
  # so both values travel into params, the manifest and the report.
  window_bp: 600
  step_bp: 200

synteny:
  # P4-01 (04/10/2026): the same mVISTA-style window as diversity, on purpose — the % identity
  # series and the π curve are read side by side, and two different windows would invite
  # comparing a peak in one with a trough in the other. The nucmer parameters below are
  # MUMmer 4's own defaults, passed explicitly so the argv records them (D4-04).
  window_bp: 600
  step_bp: 200
  min_match: 20
  min_cluster: 65
  filter: "-1"

report:
  draft_banner: "*Draft — needs human review.*"

mito:
  # P3A-03 (03/10/2026): the floors a transferred mito call must clear, and the code it is read
  # in. Measured on the answer-key record OX459128.1: spurious and repeat-derived alignments sit
  # at 40-45 % identity, while the weakest real gene there — sdh4, which the record itself marks
  # /pseudo — is 50.4 % over 78 % of its reference. The floors are reported in every run's
  # summary; `--set min_identity=… min_coverage=…` overrides them for an experiment.
  min_identity: 50.0
  min_coverage: 0.5
  evalue: 1.0e-5
  # Plant mitochondria translate with NCBI table 1 (D3-03). The caller stamps it on every CDS it
  # calls, so the initiator test that decides a partial start and the ORF checks downstream read
  # the same number instead of two defaults that happen to agree.
  translation_table: 1
