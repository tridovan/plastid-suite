# Central defaults — thresholds in one place, not scattered through modules.

ir:
  min_identity: 0.999 # the mandatory gate (PROJECT.md §9A)
  min_length: 5000
  copy_length_tolerance: 5

ssr:
  misa:
    # MISA defaults as shipped in the IPK zip (PROJECT.md §10.2) — do not "tune" them.
    unit_repeats: { 1: 10, 2: 6, 3: 5, 4: 5, 5: 5, 6: 5 }
    interruptions: 100

codon:
  # D2-03 (03/10/2026): the toolkit compiles NCBI table 1 (standard) — plastid CDS declare table
  # 11, whose amino acids are identical (the tables differ only in initiation codons), and the
  # initiator is read as its own amino acid (measured 05/10/2026, PROJECT.md §9.J). The table is
  # compiled into core/codon.py; a test keeps this record and that constant in step.
  translation_table: 1
  # CAI · CBI · Fop are only meaningful against a declared reference. Until a highly-expressed
  # set is defined, the reference is the analysed CDS set itself — named in every output.
  reference: self

orf:
  # D3-03 (03/10/2026): the check reads the record's own /transl_table. This value is the
  # fallback for a record that declares none. It is the same number as codon.translation_table
  # on purpose — but it is a different decision (what to do when the record is silent), so it
  # is recorded separately. Measured: all 1,099 CDS in the project's dataset declare 11.
  #
  # It is also organelle-blind (measured 05/10/2026, §9.J): a *plastid* record that declares
  # nothing is checked against table 1's smaller initiator set, while the plastid annotator
  # stamps 11 for the same silence — the two paths answer one question two ways. Choosing per
  # organelle needs the run to know its organelle, which is H-09's job; until then this stays
  # as recorded rather than half-fixed.
  default_translation_table: 1

diversity:
  # D2-02 (03/10/2026): the mVISTA-style convention. A π curve means nothing without its window,
  # so both values travel into params, the manifest and the report.
  window_bp: 600
  step_bp: 200

synteny:
  # P4-01 (04/10/2026): the same mVISTA-style window as diversity, on purpose — the % identity
  # series and the π curve are read side by side, and two different windows would invite
  # comparing a peak in one with a trough in the other. The nucmer parameters below are
  # MUMmer 4's own defaults, passed explicitly so the argv records them (D4-04).
  window_bp: 600
  step_bp: 200
  min_match: 20
  min_cluster: 65
  filter: "-1"

repeats:
  # M2.12/D-f (10/10/2026): the floor every published match clears — repeat-match is given it
  # as `-n`, and a match the tool returns below it is refused rather than published (the
  # adapter checks). It is part of what the count means, so it travels into the summary and the
  # scope label. Measured on the golden: 9 maximal exact matches at 30 bp, the 26,214 bp IR
  # pair among them (both engines agree — §8.58).
  min_length_bp: 30

report:
  draft_banner: "*Draft — needs human review.*"

mito:
  # P3A-03 (03/10/2026): the floors a transferred mito call must clear, and the code it is read
  # in. Measured on the answer-key record OX459128.1: spurious and repeat-derived alignments sit
  # at 40-45 % identity, while the weakest real gene there — sdh4, which the record itself marks
  # /pseudo — is 50.4 % over 78 % of its reference. The floors are reported in every run's
  # summary; `--set min_identity=… min_coverage=…` overrides them for an experiment.
  min_identity: 50.0
  min_coverage: 0.5
  evalue: 1.0e-5
  # Plant mitochondria translate with NCBI table 1 (D3-03). The caller stamps it on every CDS it
  # calls, so the initiator test that decides a partial start and the ORF checks downstream read
  # the same number instead of two defaults that happen to agree.
  translation_table: 1

plastid:
  # P3B-07/P3B-08 (08/10/2026): the floors a transferred plastid call must clear, and the code it
  # is read in. Measured on the golden as the answer key against the 33 other pinned records
  # (§8.46): 4,382 HSPs, 80 CDS calls, every one landing on a published locus. The golden is a
  # close relative and **cannot choose the coverage floor** — 0.5 through 0.8 give the identical
  # called set — so 0.7 is §8.41's corpus number (the gap runs 44.93 % to 67.75 %, and psbJ is
  # 36 aa, which is why 0.5 does not hold here). P3B-10 re-checks it on the corpus.
  min_identity: 50.0
  min_coverage: 0.7
  evalue: 1.0e-5
  # Plastomes translate with NCBI table 11 (D3-03: 1,099 of 1,099 measured CDS declare it). The
  # caller stamps it on every CDS, so the initiator test and the ORF checks behind it read one
  # number instead of two defaults that happen to agree.
  translation_table: 11

naming:
  # D5-09 §7 (P3B-04). The **naming reference** is the record whose spelling every table this
  # project prints; it is genomes[0] of a gene_normalize run, supplied with
  # `--set naming_reference=<file>`, and this file records which record that is until the end user
  # picks one from the audit report. The parameter is deliberately not called `reference`: that
  # key already carries two meanings in this toolkit (a module's own reference and a record's
  # /reference qualifier), and a third would be read as one of them.
  reference_record: src/plastid/data/naming_reference.json
  # The four tests' thresholds — measured, not chosen (PROJECT.md §8.41): the smallest true
  # margin was 19.2 bits, and with coverage ≥ 0.7 no wrong locus reached 44.93 % while no true
  # ortholog fell below 67.75 %. The mito path's coverage floor of 0.5 does not hold here —
  # psbJ is 36 aa, and a 21-aa alignment of it reaches 52.38 % against matK.
  min_identity: 50.0
  min_coverage: 0.7
  min_margin_bits: 10.0
  # A tRNA is never renamed on a sequence ranking: measured, true and wrong tRNA loci overlap
  # (53.76–100 % against up to 73.97 %), so identity decides nothing at that length. The name and
  # the flanking genes are what a person can check.
  trna_sequence_decides: false
