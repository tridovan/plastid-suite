# Semantic gene-name aliases — different names for the *same locus*.
#
# This is data, not code, for the same reason gene_groups.yaml is: it is external knowledge
# (a naming convention, not a fact about our code), and the next record will bring names this
# list has not seen.
#
# THE RULE (D3-02, PROJECT.md §8.10) — [ĐÃ THAY 07/10/2026: D5-09 reverses the direction — the
# canonical forms follow the project's naming reference (the ★ record the end user picks), not the
# group's dialect]. `canonical` is the name this toolkit compares and prints; every other name of
# that locus is a synonym and is printed beside it: `ycf3 (pafI)`. The direction is not a majority
# vote and not a preference for either dialect.
#
# [ĐÃ THAY 08/10/2026 — P3B-04 flipped five of these entries, and the flip is the rule applied
# rather than a change of mind: the naming step is built, the recorded standard is
# `data/naming_reference.json`, and a standard whose spelling is not the canonical form would make
# every printed table disagree with the record the project names after. Measured against the
# golden `NC_050833.1` (PROJECT.md §8.41, tests/golden/test_naming_numbers.py, D5-09 §8): five of
# the nine loci flip — ycf3 (was pafI) · ycf4 (was pafII) · psbN (was pbf1) · clpP (was clpP1) ·
# ndhL (was ndhI) — while atpI · psaI · psbB · trnI-GAU keep their direction because the golden
# agrees with them. `core/gene_names.oriented_aliases` orients this table by whatever record the
# run hands it, so a different ★ flips it again without editing this file; the entries here are the
# direction of the **recorded** standard, and a test keeps the two in step.]
#
# It ships empty of guesses: every entry carries the evidence it rests on, and the loader
# refuses an entry without one. A name that is not listed here is left exactly as it arrived.
#
# Adding a locus means making the same three-signal measurement §8.9 made — syntenic
# neighbours, length, /product — not matching a name that "looks like" another.

loci:
  - canonical: ycf3
    synonyms: [pafI]
    evidence: >
      PROJECT.md §8.9–8.10 (2026-10-03), measured on the project's own nine annotated records.
      Same locus by three independent signals: identical syntenic neighbours (psaA … trnS-GGA
      in all seven records that use the classic name), matching /product ("photosystem I
      assembly factor I" against "photosystem I assembly protein Ycf3"), and matching length
      (507 bp; the Coleus copy 510 bp, exactly as the classic copies differ).

  - canonical: ycf4
    synonyms: [pafII]
    evidence: >
      PROJECT.md §8.9–8.10 (2026-10-03). Same locus as ycf4: syntenic neighbours psaI … cemA in
      all seven classic records, matching /product, and length 531 bp against 555 bp in both
      dialects — the same difference in both records that carry the functional name.

  - canonical: psbN
    synonyms: [pbf1]
    evidence: >
      PROJECT.md §8.9–8.10 (2026-10-03). Same locus as psbN, and the strongest of the four:
      the length matches exactly — both are 132 bp, 43 codons plus the stop — and the syntenic
      neighbours (psbT … psbH) match in all seven classic records. Krech et al. 2013 proposed
      pbf1 after showing the product acts in the biogenesis of both photosystems.

  - canonical: clpP
    synonyms: [clpP1]
    evidence: >
      PROJECT.md §8.9–8.10 (2026-10-03). Same locus as clpP: syntenic neighbours rps12 … psbB
      in all seven classic records, matching /product, and length 591 bp.

  - canonical: ndhL
    synonyms: [ndhI]
    evidence: >
      PROJECT.md §8.17 (2026-10-03), measured while annotating the golden genome with Chloe. The
      golden record names this locus ndhL; Chloe names it ndhI; the two proteins are identical
      (543 bp, 181 codons, one and the same sequence) at one and the same position. Two further
      signals point the same way: the golden record's own /product reads "NADH-plastoquinone
      oxidoreductase subunit I", and the plastid ndh complex has subunits A–K — there is no
      subunit L. Canonical direction follows the standard name, which is also the one this
      project's records from GeSeq and from Chloe use.

  - canonical: atpI
    synonyms: [atpL]
    evidence: >
      PROJECT.md §8.27 (2026-10-04), measured while P4-02's Ka/Ks run listed the genes the two
      golden records do not share. The 744 bp CDS are **byte-identical** in the two Iris records
      and carry the same /product ("ATP synthase CF0 A subunit IV"); across the 13-record panel
      the name atpL appears in **one** record (NC_024936.1) and atpI in nine. Canonical follows
      the standard name and the overwhelming majority.

  - canonical: psaI
    synonyms: [psaL]
    evidence: >
      PROJECT.md §8.27 (2026-10-04). Same locus by the same three signals: 111 bp in both Iris
      records (one base differs), the same /product ("photosystem I subunit VIII"), and psaL is
      the name of exactly one panel record while psaI is the name of nine.

  - canonical: trnI-GAU
    synonyms: [trnL-GUA]
    evidence: >
      PROJECT.md §8.29 (2026-10-04), measured while the barcode run listed the loci a record
      carries. NC_024936.1 names this locus trnl-GUA (folded to trnL-GUA by the syntax rule);
      its 77 bp sequence is **byte-identical** to the golden record's trnI-GAU at the same
      position inside the inverted repeat (both copies). The record carries no /product or
      /anticodon qualifier to appeal to, and none is needed: GUA is not a leucine anticodon —
      the Leu codons are UUA/UUG/CUU/CUC/CUA/CUG — while the sequence is exactly the isoleucine
      tRNA the golden record names trnI-GAU. Canonical follows the standard name and the record
      that agrees with it.

  - canonical: psbB
    synonyms: [bspB]
    evidence: >
      PROJECT.md §8.27 (2026-10-04). 1,527 bp in both Iris records (seven bases differ), the same
      /product ("photosystem II p680 chlorophyll A apoprotein"), and the four-letter form looks
      like a transposition of psbB — which is what nine of the ten annotated panel records write.
      Without this entry the comparison silently drops a whole photosystem-II core gene from
      every Iris calculation.
