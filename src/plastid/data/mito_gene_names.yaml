# Plant-mitochondrial gene names: the product text a record carries -> the standard symbol.
#
# WHY THIS FILE IS SEPARATE FROM gene_aliases.yaml. Measured 2026-10-03: the same product string
# occurs in both organelles — "ribosomal protein S3" is a plastid CDS product in the golden
# genome and a mitochondrial one in the stand-in mitogenome. A shared table would let a plastid
# gene be renamed to a mitochondrial symbol, which is a silent wrong of the kind this project
# keeps meeting. The plastid table maps *names*; this one maps *product text*, and only the
# mitochondrial path loads it.
#
# WHY IT IS NEEDED AT ALL. Measured on the pinned stand-in mitogenome OX459128.1: it carries no
# /gene qualifier on any feature, so every "name" our reader reports for it is really a /product
# sentence ("NADH dehydrogenase subunit 1"). A gene-set table that calls a gene by a sentence is
# not reporting a gene name.
#
# EVIDENCE BASIS, stated plainly: every synonym below is quoted verbatim from OX459128.1's own
# /product qualifiers — that part is measured. The symbol each one maps to is standard
# plant-mitochondrial nomenclature (the names used across published mitogenome annotations), and
# it has NOT yet been checked against a curated reference annotation. That check is Phase 8's
# cross-testing work; until it happens, this file is the weakest evidence in the repository and
# says so.

loci:
  - canonical: atp1
    synonyms: ["ATP synthase F1 subunit 1"]
    evidence: "OX459128.1 /product verbatim — standard plant-mitochondrial symbol atp1"
  - canonical: atp4
    synonyms: ["ATPase subunit 4"]
    evidence: "OX459128.1 /product verbatim — standard plant-mitochondrial symbol atp4 (the F0 subunit IV, which plastids lack)"
