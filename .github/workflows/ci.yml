# CI — M8.4. Two jobs, split by what they need, because that split is the point:
#
#   * `fast` is the tier the project can always run: ruff, the unit suite and the **tier-A golden**
#     — pure Python over the vendored fixture. It needs no external tool and no network, so a
#     broken golden number turns this build red on its own.
#   * `golden-tier-b` installs the **pinned** tools the tool-dependent golden needs. Every pin
#     below is a version the repository records: the runtime ones in `environment.yml`, Vmatch in
#     `environment-check.yml` (M11.19 — it is a cross-check engine, not a module's dependency, and
#     the tier-B job installs it on purpose because a check that skips proves nothing). An
#     unpinned `conda install mafft` is not a shortcut — two MAFFT builds were measured giving two
#     Ts/Tv numbers from one genome.
#   * Neither job selects tests marked `panel`: they read `.panel/`, the private validation data
#     git never carries. `make acceptance` runs them on a machine that has the panel. Both jobs
#     call the Makefile targets, so CI and a local `make test`/`make golden` select the same set.
#
# `PTS_REQUIRE_TOOLS=1` in the tier-B job turns "tool missing" from a printed skip into a failure:
# a green build that quietly skipped the tools would prove nothing. **R is a tool here** (M11.8):
# until 28/10/2026 its checks called `pytest.skip` directly, so CI was green while every figure
# script went unrun. `conftest.require_r` now honours the variable, and R is installed below. table2asn is the one tool that
# cannot come from conda, so the job fetches the build `docs/tools/table2asn.md` records and
# checks its md5 — the same reasoning as the pins.

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: lint · fast tests · tier-A golden (pure Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - name: ruff (lint + format check)
        run: make lint
      - name: fast tests
        run: make test
      - name: tier-A golden — the golden numbers, no tools
        run: uv run pytest -q tests/golden/test_tier_a.py

  golden-tier-b:
    name: golden tier B (pinned tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: pts-tools
          cache-environment: true
          create-args: >-
            -c conda-forge
            -c bioconda
            python=3.12
            perl=5.32.1
            mafft=7.526
            iqtree=2.3.6
            r-base=4.3
            r-ggplot2
            r-dplyr
            r-tidyr
            r-reshape2
            r-rcolorbrewer
            r-zoo
            r-scales
            r-pheatmap
            r-ape
            mummer4=4.0.1
            paml=4.10.10
            blast=2.17.0
            aragorn=1.2.41
            macse=2.07
            openjdk=17
            vmatch=2.3.1
      - name: put the pinned tools on PATH
        # The action activates the environment for interactive shells; a `run:` step is neither
        # interactive nor a login shell, so the binaries have to be put on PATH explicitly.
        # Measured 10/10/2026 (first CI run): without this line the tools were installed and every
        # tier-B test still reported "missing external tool(s): mafft".
        run: echo "${MAMBA_ROOT_PREFIX:-$HOME/micromamba}/envs/pts-tools/bin" >> "$GITHUB_PATH"
      - name: the pins, printed — a version nobody can read is not a pin
        run: |
          mafft --version
          iqtree2 --version | head -1
          Rscript --version
          nucmer --version | head -1
          blastn -version | head -1
          aragorn -h 2>&1 | head -1
          macse -help 2>&1 | head -1
          vmatch -version 2>&1 | head -2
          perl -v | grep -E "^This is perl 5"
      - name: fetch table2asn and check the recorded md5
        run: |
          curl -sSL -o table2asn.gz \
            https://ftp.ncbi.nlm.nih.gov/asn1-converters/by_program/table2asn/linux64.table2asn.gz
          gunzip table2asn.gz
          chmod +x table2asn
          echo "8b5b6cbede9d38b47c7c4cae29a25a0a  table2asn" | md5sum -c -
      - name: fetch MISA 2.1 and check the recorded md5
        # MISA is not bundled (D-q: its source zip states no licence, docs/tools/misa.md), so the
        # build fetches it the way a user does — from IPK, checked against the md5 in docs/tools/misa.md. Without this
        # step the SSR golden would skip, and a tier-B job that silently skips proves nothing.
        run: |
          curl -sSLO https://webblast.ipk-gatersleben.de/misa/misa_sourcecode_25082020.zip
          echo "cf9d3579f7caacd02f99830b329c7d9c  misa_sourcecode_25082020.zip" | md5sum -c -
          mkdir -p "$HOME/misa"
          unzip -j misa_sourcecode_25082020.zip misa.pl -d "$HOME/misa"
          echo "cfebc1d1a36fddfd6e0d897c96babd12  $HOME/misa/misa.pl" | md5sum -c -
          echo "PTS_MISA_DIR=$HOME/misa" >> "$GITHUB_ENV"
      - run: uv sync --all-extras --frozen
      - name: golden tier B — the tool-dependent numbers
        env:
          PTS_REQUIRE_TOOLS: "1"
          PTS_TABLE2ASN: ${{ github.workspace }}/table2asn
        run: make golden
