[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plastid-suite"
version = "1.0.0"
description = "Toolkit for plastid and mitochondrial genome analysis (academic, non-commercial)"
readme = "README.md"
keywords = ["plastome", "chloroplast", "mitochondrial genome", "bioinformatics", "genomics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# No `Operating System :: Microsoft :: Windows`: the toolkit does not run natively there, and the
# Windows route is Docker (docs/things_we_do_not_do.md) — a classifier claiming it would be the
# kind of plausible-looking untruth this project exists to avoid.
requires-python = ">=3.10"
authors = [{ name = "PlastidToolSuite contributors" }]
# Decided in Phase 9 (D-p, 11/10/2026): MIT — the toolkit's own code, permissively licensed so a
# research group can use it without a lawyer. `docs/licensing.md` records why, and what does NOT
# travel with it: no external tool is bundled, and MISA left the package for exactly this reason.
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "biopython>=1.83",
    "PyYAML>=6.0",
]

[project.scripts]
plastid = "plastid.cli:main"

[project.urls]
Homepage = "https://github.com/tridovan/plastid-suite"
Repository = "https://github.com/tridovan/plastid-suite"
Issues = "https://github.com/tridovan/plastid-suite/issues"

[project.optional-dependencies]
docx = [
    "python-docx>=1.2.0",
]
figures = [
    "matplotlib>=3.8",
]
stats = [
    "scipy>=1.11",
]
excel = [
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/plastid"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["plastid"]

# Absolute imports only — the architecture test (tests/unit/test_architecture.py)
# resolves every import against the layer map.
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# The repo root, so a test can import `tools/corpus_bar.py` — the instrument that measures
# P3B-10's bar. It is not a shipped module (it drives the CLI as a user would), so it lives
# outside `src/`, and its classification rule is tested like any other claim in this repo.
pythonpath = ["."]
markers = [
    "tier_b: requires external tools (MISA/cpstools/MAFFT); skipped with a printed reason when absent",
]
