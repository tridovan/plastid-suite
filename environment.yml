# Tool-equipped environment — the tools a **released analysis** calls (M11.19).
#
# The minimum install is `pip install 'plastid-suite'` — the pure-Python analyses need none of
# this, and every tier-B test skips with a printed reason when a tool is absent rather than
# failing. This file is for the analyses that *do* need a tool.
#
# VERSIONS ARE PART OF THE RESULT. The same input was measured giving Ts/Tv 2.667
# with one aligner and 2.686 with MAFFT — an unpinned `mafft` here would hand two users two
# different golden numbers from the same genome. Every version below is the one the
# golden numbers were measured with; where none was recorded, the line says so instead of pretending to be pinned.
#
# WHAT IS AND IS NOT IN THIS FILE (M11.19, G-04). `environment.yml` is the runtime scope: every
# entry is called by a module or a CLI step, and the role of each is in `docs/tools/README.md`.
# Two other files carry everything else, so that installing the analyses never drags in an
# assembly pipeline:
#
#   environment-check.yml   cross-check engines — no module calls them
#   environment-future.yml  deferred branches (assembly, dating) and survey-only tools
#
# A package installed in an environment is not a feature. `tests/unit/test_tool_inventory.py`
# keeps the three files and that inventory in step, both directions.
#
# Installing:  conda env create -f environment.yml
# Windows users run the toolkit through docker/ instead.
name: plastid-suite
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.10

  # --- SSR and alignment ----------------------------------------------------------------
  - perl=5.32.1 # MISA 2.1 is a Perl script, and it is NOT bundled (its zip states no licence:
                # D-q, docs/tools/misa.md has the download line and both hashes). perl is
                # installed here; the script is obtained separately
  - mafft=7.526 # pinned, tarball md5 recorded. conda-forge only — bioconda stops
                # at 7.525, and the aligner build changes the Ts/Tv number
  - macse=2.07 # codon-aware CDS alignment, opt-in for `phylogeny` (aligner=macse, M11.21).
               # CeCILL 2.1, a Java jar; bioconda is the route because the vendor URL no longer
               # serves 2.07 (measured 28/10/2026) — docs/tools/macse.md has both hashes

  # --- annotation -----------------------------------------------------------------------
  - aragorn=1.2.41 # the tRNA caller (P3A-04): 147 kB on bioconda, GPLv3, and the tool PMGA
                   # itself runs inside. Upstream ansikte.se answers HTTP 455 (blocked), so
                   # bioconda is the route — docs/tools/aragorn.md
  - blast=2.17.0 # our own caller (P3A-03, plastid P3B-07) transfers annotations with it, so the
                 # version is part of the result — measured 03/10/2026 (docs/tools/blast.md).
                 # Also satisfies PGA's "BLAST+ 2.8.1 or newer"

  # --- comparison, figures --------------------------------------------------------------
  - mummer4=4.0.1 # nucmer + delta-filter + show-coords, the synteny pipeline (P4-01, D4-02),
                  # and repeat-match, the repeats module's engine (M2.12, D-f). No version was
                  # recorded before; this is the build the block numbers were measured with
                  # (docs/tools/mummer4.md). The block count moves with the parameters, and the
                  # alignment can move with the build — not pinned means not reproducible
  - iqtree=2.3.6 # maximum-likelihood tree inference for the `phylogeny` module (M11.21),
                 # following the CGAS route (MAFFT per gene -> supermatrix -> IQ-TREE). Model
                 # selection is ModelFinder and the bootstrap implementation has changed between
                 # 2.x builds, so the release is part of the tree — docs/tools/iqtree.md
  - paml=4.10.10 # two programs of one package: yn00 is the Ka/Ks estimator (P4-02, D4-01,
                 # docs/tools/paml.md) and is runtime; mcmctree is a dating program that is NOT
                 # a module of this toolkit (removed from the plan 10/10/2026) and is survey-only
  - r-base=4.3 # the plotting engine behind the seven figure scripts (docs/tools/r.md). R is a
               # PLOTTING engine here and nothing else: none of the scripts computes a number the
               # toolkit does not already hold in a table cell. Measured 17/10/2026 — all seven
               # run under 4.3.3 here and under the author's 4.1.2, so the figures do not move
               # with the interpreter. The scripts themselves are package data, not a tool:
               # src/plastid/data/r_scripts/
  - r-ggplot2 # the nine the scripts call. NOT pinned, and the reason is the opposite of MAFFT's:
              # these draw a picture, they do not produce a number that reaches a table, so a
              # version bump cannot move a golden figure's data. No version is recorded for any
              # of them. A missing one is named before any figure is attempted
  - r-dplyr
  - r-tidyr
  - r-reshape2
  - r-rcolorbrewer
  - r-zoo
  - r-scales
  - r-pheatmap
  - r-ape

  # --- NOT here, on purpose ---------------------------------------------------------------
  # vmatch, cpstools, kakscalculator2
  #            cross-check only — no module calls them. environment-check.yml
  # getorganelle, spades, bandage, oatk, raven-assembler, novoplasty, minimap2, samtools,
  # wgsim, sibelia, mreps, trf, beast2
  #            deferred/survey — no module calls them. environment-future.yml
  # PGA        retired from the toolkit 10/10/2026 (P3B-11) and never a dependency; its
  #            outputs survive as measured counter-examples in tests/data/corpus/*.pga.gb. Its
  #            pinned source is commit 0683a0ec… (sha256 0d55b70e…), and it is GPL-3.0 —
  #            it must not be bundled into the MIT-licensed package (docs/licensing.md).
  # table2asn  not on conda — NCBI ships it directly:
  #            ftp.ncbi.nlm.nih.gov/asn1-converters/by_program/table2asn/
  # misa.pl    obtained separately, never bundled (docs/tools/misa.md)
  # cpjsdraw   cloned by the user (docs/tools/cpjsdraw.md)
  # mito       MITOS2 is a METAZOAN annotator and cannot do a plant mitochondrion. PMGA
  #            (MAKER, CPGAVAS2, ARAGORN, tRNAscan-SE, TRF, Vmatch…) is far heavier and never ran
  #            here; the mito annotate step is this project's own caller (P3A), covered by
  #            the blast/aragorn pinned above — nothing here is open.
  # deepred-mt needs TensorFlow ~2 GB and predicts mitochondrial editing only (PMGA uses it).
  #            M4.5's plastid predictor is the published PREP method run inside PTS with the
  #            MAFFT pinned above; the original PREP-Cp service ended in 2022 and has no install
  #            line (docs/tools/prep_cp.md).
