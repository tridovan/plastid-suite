# Tool-equipped environment (tier B and the later phases).
#
# The minimum install is `pip install 'plastid-suite'` — the pure-Python analyses need none of
# this, and every tier-B test skips with a printed reason when a tool is absent rather than
# failing. This file is for the analyses that *do* need a tool.
#
# VERSIONS ARE PART OF THE RESULT. PROJECT.md §9.B-14 measured the same input giving Ts/Tv 2.667
# with one aligner and 2.686 with MAFFT — an unpinned `mafft` here would hand two users two
# different golden numbers from the same genome. Every version below is the one PROJECT.md §7.8
# records; where §7.8 records none, the line says so instead of pretending to be pinned.
#
# Installing:  conda env create -f environment.yml
# Windows users run the toolkit through docker/ instead (ROADMAP.md M9.2).
name: plastid-suite
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.10

  # --- Phase 2: SSR and alignment -------------------------------------------------------
  - perl=5.32.1 # MISA 2.1 is a Perl script (vendored, md5-pinned — src/plastid/vendor/misa)
  - mafft=7.526 # §7.8 pins it AND records the tarball md5. conda-forge only — bioconda stops
                # at 7.525, and §9.B-14 shows the aligner changes the Ts/Tv number
  - cpstools=3.0 # bioconda only — NOT on conda-forge (§7.8). A CROSS-CHECK tool, not a module
                # dependency (D-j): no module of this toolkit calls it, and the minimum install
                # stays pip-only. The dev machine runs the same 3.0 as a pip install in its own
                # env — docs/tools/cpstools.md, measured 10/10/2026
  - kakscalculator2=2.0.1 # the KaKs_Calculator binary cpstools' KaKs sub-command shells out to;
                # cross-check only (§8.61). Our own Ka/Ks module uses PAML's yn00, pinned below

  # --- Phase 3: annotation --------------------------------------------------------------
  - aragorn=1.2.41 # the mito tRNA caller (P3A-04): 147 kB on bioconda, GPLv3, and the tool PMGA
                   # itself runs inside. Upstream ansikte.se answers HTTP 455 (blocked), so
                   # bioconda is the route — docs/tools/aragorn.md
  - blast=2.17.0 # our own mito caller (P3A-03) transfers annotations with it, so the version is
                 # part of the result — measured 03/10/2026 (docs/tools/blast.md). Also satisfies
                 # PGA's "BLAST+ 2.8.1 or newer".

  # --- Phase 4+: comparison, figures, dating ---------------------------------------------
  - mummer4=4.0.1 # nucmer + delta-filter + show-coords, the synteny pipeline (P4-01, D4-02),
                 # and repeat-match, the repeats module's engine (M2.12, D-f). §7.8 recorded no
                 # version; this is the build the block numbers were measured with
                 # (docs/tools/mummer4.md). The block count moves with the parameters, and the
                 # alignment can move with the build — not pinned means not reproducible
  - mreps # §7.8 records no version
  - trf # §7.8 records no version
  - vmatch=2.3.1 # academic-only licence (§7.8)
  - pycirclize=1.10.1 # conda-forge (§7.8)

  # --- Phase 6/7: assembly and dating ----------------------------------------------------
  - getorganelle=1.7.7.1 # needs a one-off seed download: get_organelle_config.py -a embplant_pt,embplant_mt
  - spades=4.3.0
  - sibelia=3.0.7
  - bandage=0.9.0
  - oatk=1.0 # needs an external HMM DB: github.com/c-zhou/OatkDB
  - raven-assembler=1.8.3
  - novoplasty # §7.8 records no version
  - minimap2 # §7.8 records no version
  - samtools # §7.8 records no version
  - wgsim # §7.8 records no version
  - paml=4.10.10 # two programs of one package: yn00 is Phase 4's Ka/Ks estimator (P4-02, D4-01,
                 # docs/tools/paml.md); mcmctree is Phase 6's (§7.8)
  - beast2=2.7.7

  # --- NOT here, on purpose ---------------------------------------------------------------
  #            Vendoring it the way MISA is vendored is undecided; its pinned source (commit,
  #            sha256) is in PROJECT.md §7.8, and its licence goes through the Phase 9 review.
  # table2asn  not on conda — NCBI ships it directly:
  #            ftp.ncbi.nlm.nih.gov/asn1-converters/by_program/table2asn/
  # mito       MITOS2 is a METAZOAN annotator and cannot do a plant mitochondrion (§7.8b). PMGA
  #            (MAKER, CPGAVAS2, ARAGORN, tRNAscan-SE, TRF, Vmatch…) is far heavier and never ran
  #            here; the mito annotate step is this project's own caller (P3A, §8.22), covered by
  #            the blast/aragorn pinned above — nothing here is open.
  # deepred-mt needs TensorFlow ~2 GB (§7.8); PMGA's RNA-editing module uses it
